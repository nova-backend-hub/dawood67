<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="WinDock">
  <meta name="theme-color" content="#F2F3F7">
  <title>WinDock - Windows App Launcher</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
</head>
<body>
  <div class="app-container">
    <!-- Top Bar / Header -->
    <header class="top-bar">
      <div class="status-pill" id="statusPill" onclick="openSettings()">
        <span class="status-dot online" id="statusDot"></span>
        <span class="status-text" id="statusText">Connected to PC</span>
      </div>

      <div class="mode-switcher">
        <button class="mode-btn active" id="mode8Btn" onclick="switchMode('8apps')">8 Apps</button>
        <button class="mode-btn" id="mode4ClockBtn" onclick="switchMode('4clock')">4 Apps + Clock</button>
      </div>

      <button class="icon-btn settings-btn" onclick="openSettings()" aria-label="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Main Content Area -->
    <main class="content-stage">
      <!-- Mode 1: 8 Apps Layout -->
      <section class="dock-layout mode-8-active" id="layout8Apps">
        <div class="dock-panel apple-glass">
          <div class="apps-grid" id="appsGrid8">
            <!-- Dynamically populated 8 Apps -->
          </div>
        </div>
      </section>

      <!-- Mode 2: 4 Apps + Clock Layout -->
      <section class="dock-layout mode-4clock" id="layout4Clock" style="display: none;">
        <div class="split-dock-panel apple-glass">
          <!-- Left 4 Apps Dock -->
          <div class="left-dock" id="leftApps4">
            <!-- Dynamically populated 4 Apps -->
          </div>

          <!-- Divider -->
          <div class="dock-divider"></div>

          <!-- Right Clock Widget -->
          <div class="right-clock-widget">
            <div class="clock-display">
              <div class="time-main">
                <span id="clockHours">12</span><span class="colon">:</span><span id="clockMinutes">00</span>
                <span class="ampm-tag" id="clockAmPm">PM</span>
              </div>
              <div class="time-seconds-track">
                <div class="seconds-bar" id="secondsBar"></div>
              </div>
              <div class="date-main" id="clockDate">FRIDAY, NOV 6</div>
            </div>
            <div class="pc-badge">
              <span class="pc-icon">💻</span>
              <span id="pcName">Windows Desktop</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- Bottom Launch Feedback Toast -->
    <div class="toast-pill" id="toastPill">
      <span class="toast-icon">🚀</span>
      <span class="toast-msg" id="toastMsg">Launching app...</span>
    </div>

    <!-- Settings Modal -->
    <div class="modal-backdrop" id="settingsModal" onclick="closeSettings(event)">
      <div class="modal-card apple-glass" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3>WinDock Settings</h3>
          <button class="close-btn" onclick="closeSettings()">&times;</button>
        </div>
        <div class="modal-body">
          <label class="form-label">Windows PC Server Address</label>
          <div class="input-row">
            <input type="text" id="serverIpInput" class="apple-input" placeholder="e.g. 192.168.1.100:5050">
            <button class="save-btn" onclick="saveServerAddress()">Connect</button>
          </div>
          <p class="hint-text">Make sure your iPhone and PC are on the same Wi-Fi network.</p>

          <hr class="modal-hr">

          <label class="form-label">Customize Quick Apps</label>
          <div class="app-customizer-list" id="customizerList">
            <!-- Dynamic app editor -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
