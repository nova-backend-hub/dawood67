name: Build WinDock iOS IPA

on:
  push:
    branches: [ "main", "master", "windock" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      run: |
        sudo xcodebuild -runFirstLaunch
        xcodebuild -version

    - name: Build Project
      run: |
        xcodebuild -project WinDock.xcodeproj \
                   -scheme WinDock \
                   -configuration Release \
                   -sdk iphoneos \
                   -derivedDataPath build \
                   CODE_SIGN_IDENTITY="" \
                   CODE_SIGNING_REQUIRED=NO \
                   CODE_SIGNING_ALLOWED=NO \
                   ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS=NO \
                   ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS=NO

    - name: Package into IPA
      run: |
        mkdir -p Payload
        cp -r build/Build/Products/Release-iphoneos/WinDock.app Payload/
        zip -r "WinDock_unsigned.ipa" Payload
        rm -rf Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WinDock-unsigned-ipa
        path: WinDock_unsigned.ipa
        retention-days: 14
